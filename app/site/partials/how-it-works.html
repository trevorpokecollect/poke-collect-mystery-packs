      <h1 id="hiw-title">Open Packs Online. Own Real Cards.</h1>

      <p class="hiw-lede">This guide walks through every part of Cardbit, step by step, from buying your first Cardbits to climbing the weekly leaderboard.</p>

      <h2 id="hiw-h-cardbits">Get Cardbits</h2>
      <p>Cardbits are the currency you use everywhere on Cardbit. Packs, singles from the Card Shop and shipping can all be paid for in Cardbits, and every price on the site is shown in Cardbits so you always know exactly what something costs before you confirm.</p>
      <p><strong>100 Cardbits = $1.</strong> Pick a top-up package from <strong>Buy Cardbits</strong> in the header. Bigger packages include bonus Cardbits, so the $100 and $500 packages stretch further. Have a promo code? Enter it at checkout for extra bonus Cardbits.</p>
      <p>Cardbits are added to your account as soon as your payment goes through. Your balance is always shown in the top corner of every page.</p>
      <div class="hiw-note">
        <b>Good to Know</b>
        <p>Cardbit purchases are final sale. Cardbits have no cash value, can't be cashed out, and can't be transferred or gifted to another account. You can only earn more Cardbits by selling cards back to Cardbit, winning prizes, or picking up rewards.</p>

    <div class="hiw-copy">
      <p class="hiw-num"><span>2</span>Step Two</p>
      <h2 id="hiw-h-packs">Pick a Pack</h2>
      <p>Cardbit has five packs. Each one pulls from its own pool of real Pokémon cards, and <strong>every pack guarantees at least one physical card</strong>. A Booster gives you five cards. Mystery, Gold, Japanese and Wildcard packs give you one card each.</p>
      <p>Open any pack's page before you buy to see everything in it: every card in the pool, the rarity tiers, the pull odds for each tier, and the range of Cardbits value inside each tier. Nothing is hidden.</p>
      <h3>How Pack Odds Work</h3>
      <p>Each pack draws from its own pool of specific physical cards. The odds you see are calculated from the cards in that pool that <strong>haven't been pulled yet</strong>. When someone pulls a big card, it leaves the pool and the odds update for everyone. The <strong>Odds Left</strong> meter on each pack shows how many cards of each tier are still waiting to be pulled.</p>
      <p><strong>How Tiers Are Set:</strong> a card's tier comes from how its value ranks against the other cards in that pack's current pool, so every pool keeps a steady spread from Common up to Legendary and always has at least one Legendary. Tier cutoffs are updated at each published restock and once a day as card prices change, so a card's tier in the pool can move. A card you've pulled keeps the tier it had when you pulled it.</p>
      <h3>Verified Restocks</h3>
      <p>Pools grow over time. New cards, and cards collectors sold back, join a pool only in a <strong>published restock</strong>, never in the middle of a draw. Each restock saves a numbered pool version with every card in it and a SHA-256 fingerprint, and the pack page shows its <strong>Restock History</strong>. The odds always reflect the pool as it stands right now.</p>
      <h3>Verified Shuffle</h3>
      <p>Every paid opening is drawn with a locked secret seed whose fingerprint you can see before you open, plus a client seed you can set yourself. Reveal the seed any time on the <a href="/verified-shuffle">Verified Shuffle</a> page and check that it picked exactly your cards, from the published pool version it names.</p>
    </div>

      <h2 id="hiw-h-vault">Your Vault</h2>
      <p>Every card you pull, and every single you buy from the Card Shop, lands in <strong>My Vault</strong>. Each one is the actual physical copy we're holding for you, stored securely and insured until you sell it back or ship it.</p>
      <p>Open any card to see:</p>

      <p>The <strong>Vault Total</strong> at the top adds up the estimated value of every card you're holding, so you can watch your collection grow. <strong>Collection Progress</strong> tracks how much of each pack line you've pulled.</p>

  </section><section class="hiw-step cb-wrap" id="hiw-sparks" aria-labelledby="hiw-h-sparks">
    <div class="hiw-copy">
      <p class="hiw-num hiw-num-alt"><img src="/site/assets/cardbit-sparks.svg" alt="" width="22" height="22" loading="lazy">Bonus</p>
      <h2 id="hiw-h-sparks">Sparks: A Little Back on Every Low Pull</h2>
      <p>Not every pack is a winner, so Cardbit gives you something back when it isn't. Whenever a paid pack's cards are worth less than what you paid, you earn <strong>Sparks</strong> equal to <strong>5% of the difference</strong>.</p>
      <p>"Worth" means the buyback offer, in Cardbits, of the cards you pulled at the moment you opened the pack. For a Booster, all five cards are added together.</p>
      <p>Spend Sparks in the <strong>Spark Shop</strong> on real cards. A card worth up to 50 Cardbits costs 250 Sparks, up to 100 Cardbits costs 500 Sparks, and up to 200 Cardbits costs 1,000 Sparks.</p>
      <p class="hiw-small">Sparks are earned once per opening, so replays never add more. A refunded opening takes its Sparks back. Sparks have no cash value and can't be transferred. Demo Openings don't earn Sparks.</p>
    </div>

  </section><section class="hiw-faq cb-wrap cb-read" id="hiw-faq" aria-labelledby="hiw-h-faq">
    <h2 id="hiw-h-faq">Frequently Asked Questions</h2>
    <div class="cb-faq">
      <details><summary>Is Every Card Real?</summary><p>Yes. Every pack is backed by physical cards in our inventory. When you open a pack, the specific copy you pull is reserved for you and shows up in My Vault. You can ship it to your home at any time.</p></details>
      <details><summary>Can Skipping or Replaying Change My Card?</summary><p>No. Your card is assigned the moment you confirm the purchase, before the animation plays. Skip shows the same result instantly, and Replay shows the same cards in the same order with no charge.</p></details>
      <details><summary>What's the Difference Between a Demo Opening and a Real One?</summary><p>A Demo Opening plays the full animation for free. It spends zero Cardbits and doesn't award a physical card. A paid opening spends Cardbits and puts a real card in your Vault.</p></details>
      <details><summary>Can I Get Cash for My Cardbits?</summary><p>No. Cardbits have no cash value and can't be cashed out, transferred or gifted. Top-ups are final sale. You can spend Cardbits on packs, singles and shipping.</p></details>
      <details><summary>How Is a Buyback Offer Decided?</summary><p>Each card's offer is based on current market prices for that exact printing, language and condition, along with Cardbit's buyback rates, and it's shown in Cardbits. Offers can change daily. You get the offer shown at the moment you confirm, and if it changes before you accept, you'll see the new amount and confirm again.</p></details>
      <details><summary>How Much Does Shipping Cost?</summary><p>Shipping is a flat $6 for any order, or 600 Cardbits. Vault shipments of 30 or more cards, or 10,000 Cardbits or more in card value, ship free. You can combine cards from as many openings as you like in one shipment. We ship to U.S. addresses only and process shipments within 48 hours. Occasionally an account gets a short security review before its cards ship; your cards stay safe in your vault while it does.</p></details>
      <details><summary>What If My Package Is Lost?</summary><p>Once USPS (or the carrier used) confirms your package is lost, we refund the total value of the cards and products in it as Cardbits, valued at each item's Cardbit price (or its buyback offer) on the day you requested the shipment. Every card is one of a kind, so we can't send a replacement. Report it within 30 days of the expected delivery date. If tracking shows it was delivered to the correct address, theft, damage and other issues after delivery need to be reported to the carrier.</p></details>
      <details><summary>How Long Can I Keep Cards in My Vault?</summary><p>Your cards stay in your Vault, stored securely and insured, until you ship them or sell them back. Accounts with no activity for 12 months are covered by our inactivity rule, explained in our Policies.</p></details>
      <details><summary>Why Did the Odds Change Since Yesterday?</summary><p>Odds are based on the packs left in a series. Each time a card is pulled, it leaves the series, so the odds for the remaining packs shift. The odds on the pack page are always current.</p></details>
      <details><summary>Do Free Spins or Demo Openings Count Toward the Leaderboard?</summary><p>No. Only Cardbits spent on paid packs count, minus refunds.</p></details>
      <details><summary>Who Can Use Cardbit?</summary><p>Cardbit is for collectors 18 and older in the United States. Packs aren't available in Alabama, Washington, Hawaii, Utah, Idaho, Nevada, New York or Minnesota.</p></details>
      <details><summary>Is There a Minimum Card Value in a Pack?</summary><p>There's no set minimum. Every pack page lets you search the full card pool, so you can see the lowest-value card you could pull before you buy.</details>
    </div>
