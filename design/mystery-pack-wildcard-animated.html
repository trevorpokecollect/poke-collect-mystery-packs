<!doctype html><html><head><meta charset="utf-8">
<!-- Poke-Collect Mystery Pack, Wildcard Edition (neon orange glow, 1 card, English + Japanese, 5 tiers up to Legendary). Same layout as mystery-pack-animated.html. Export at 900x900 (the bag sits at x 235-665, y 38-862,
     which the My Packs tile clips to). Open in Chrome and screenshot, or use headless Chrome. -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet">
<style>html,body{margin:0;background:#07070b}svg{display:block}text{font-family:Montserrat,Arial,sans-serif}.mono{font-family:'JetBrains Mono',monospace}</style><style>
:root{--t:0}
.a-aura,.a-ember,.a-title,.a-float,.a-holo,.a-sparks,.a-ball,.a-beam,.a-edge2{animation-duration:3s;animation-iteration-count:infinite;animation-play-state:paused;animation-delay:calc(var(--t)*-1s);transform-box:view-box}
.a-aura{animation-name:aura;animation-timing-function:ease-in-out;transform-origin:450px 450px}
@keyframes aura{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.035)}}
.a-ember{animation-name:ember;animation-timing-function:linear}
@keyframes ember{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-260px);opacity:0}}
.a-float{animation-name:float;animation-timing-function:ease-in-out}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.a-holo{animation-name:holo;animation-timing-function:linear}
@keyframes holo{0%{filter:hue-rotate(0deg) brightness(1)}50%{filter:hue-rotate(12deg) brightness(1.15)}100%{filter:hue-rotate(0deg) brightness(1)}}
.a-edge2{animation-name:edge;animation-timing-function:ease-in-out}
@keyframes edge{0%,100%{opacity:.15}50%{opacity:.75}}
.a-beam{animation-name:beam;animation-timing-function:linear}
@keyframes beam{0%{transform:translateY(0)}100%{transform:translateY(960px)}}
.a-title{animation-name:glitch;animation-timing-function:steps(1)}
@keyframes glitch{0%,62%,70%,100%{transform:translate(0,0)}63%{transform:translate(-6px,0)}65%{transform:translate(5px,-2px)}67%{transform:translate(-3px,1px)}}
.a-sparks{animation-name:twinkle;animation-timing-function:ease-in-out}
@keyframes twinkle{0%,100%{opacity:.35}25%{opacity:1}55%{opacity:.5}80%{opacity:1}}
.a-ball{animation-name:ball;animation-timing-function:ease-in-out;opacity:.75}
.a-ball0{animation-delay:calc(var(--t)*-1s + 0s)}.a-ball1{animation-delay:calc(var(--t)*-1s + .4s)}
.a-ball2{animation-delay:calc(var(--t)*-1s + .6s)}.a-ball3{animation-delay:calc(var(--t)*-1s + .9s)}.a-ball4{animation-delay:calc(var(--t)*-1s + 1.2s)}
@keyframes ball{0%,40%,100%{opacity:.7}15%{opacity:1;filter:brightness(1.6)}}
</style>
<script>if(/[?&]bg=0/.test(location.search))document.write('<style>html,body{background:transparent}.backdrop{display:none}</style>');var m=location.search.match(/t=([0-9.]+)/);if(m)document.documentElement.style.setProperty('--t',m[1]);else document.querySelectorAll('[class^=a-]').forEach(function(e){e.style.animationPlayState='running'});</script>
</head><body>
<svg width="900" height="900" viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="bgGlow" cx=".5" cy=".55" r=".6"><stop offset="0" stop-color="#3d1600"/><stop offset=".55" stop-color="#12060a"/><stop offset="1" stop-color="#07070b"/></radialGradient>
  <linearGradient id="bag" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0d0d12"/><stop offset=".55" stop-color="#120a10"/><stop offset="1" stop-color="#1c060c"/></linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity=".07"/><stop offset=".18" stop-color="#fff" stop-opacity="0"/>
    <stop offset=".78" stop-color="#fff" stop-opacity="0"/><stop offset=".92" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="holo" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ff6a00"/><stop offset=".35" stop-color="#ffa53d"/><stop offset=".55" stop-color="#fff0d9"/><stop offset=".75" stop-color="#ffd400"/><stop offset="1" stop-color="#ff6a00"/></linearGradient>
  <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7a1a" stop-opacity="0"/><stop offset="1" stop-color="#ff7a1a" stop-opacity=".55"/></linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7a1a" stop-opacity="0"/><stop offset=".85" stop-color="#ffa053" stop-opacity=".22"/><stop offset="1" stop-color="#ffffff" stop-opacity=".5"/></linearGradient>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.3" fill="#000" opacity=".35"/></pattern>
  <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="1" fill="#ff7a1a" opacity=".18"/></pattern>
  <clipPath id="bagclip"><rect x="235" y="38" width="430" height="824" rx="14"/></clipPath>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="bigglow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#ff7a1a" flood-opacity=".28"/></filter>
  <filter id="aurablur" x="-30%" y="-20%" width="160%" height="140%"><feGaussianBlur stdDeviation="26"/></filter>
</defs>

<!-- backdrop -->
<g class="backdrop"><rect width="900" height="900" fill="url(#bgGlow)"/>
<rect width="900" height="900" fill="url(#dots)"/></g>

<!-- orange glow aura (pulses with the edge glow) -->
<g class="a-aura"><rect x="235" y="38" width="430" height="824" rx="14" fill="none" stroke="#ff6a00" stroke-width="22" opacity=".55" filter="url(#aurablur)"/></g>

<!-- bag -->
<g filter="url(#shadow)"><rect x="235" y="38" width="430" height="824" rx="14" fill="url(#bag)"/></g>
<g clip-path="url(#bagclip)">
  <!-- perspective grid floor -->
  <g stroke="url(#gridFade)" stroke-width="1.6" fill="none" opacity=".6">
    <path d="M235 560 H665 M235 590 H665 M235 628 H665 M235 676 H665 M235 736 H665"/>
    <path d="M450 520 L450 700 M450 520 L380 700 M450 520 L310 700 M450 520 L240 700 M450 520 L170 700 M450 520 L520 700 M450 520 L590 700 M450 520 L660 700 M450 520 L730 700"/>
  </g>
  <!-- circuit traces -->
  <g stroke="#ff7a1a" stroke-width="2" fill="none" opacity=".55" filter="url(#glow)">
    <path d="M235 205 H285 L305 225 V300"/><path d="M665 160 H610 L590 180 V240 H560"/>
    <path d="M235 430 H262 L276 444 V520"/><path d="M665 470 H640 L626 484 V545"/>
  </g>
  <g fill="#ff7a1a" filter="url(#glow)"><circle cx="305" cy="300" r="4"/><circle cx="560" cy="240" r="4"/><circle cx="276" cy="520" r="4"/><circle cx="626" cy="545" r="4"/></g>
  <!-- top seal: thin neon line + notch + hang hole -->
  <rect x="235" y="38" width="430" height="44" fill="#000" opacity=".45"/>
  <g stroke="#2a2a33" stroke-width="2"><path d="M235 50 H665 M235 60 H665 M235 70 H665"/></g>
  <rect x="235" y="82" width="430" height="2.5" fill="#ff7a1a" filter="url(#glow)"/>
  <rect x="235" y="818" width="430" height="44" fill="#000" opacity=".45"/>
  <g stroke="#2a2a33" stroke-width="2"><path d="M235 830 H665 M235 840 H665 M235 850 H665"/></g>
  <rect x="235" y="815.5" width="430" height="2.5" fill="#ff7a1a" filter="url(#glow)"/>

  <!-- HUD corner brackets -->
  <g stroke="#f4f4f6" stroke-width="3" fill="none" opacity=".85">
    <path d="M258 108 V96 H276"/><path d="M642 108 V96 H624"/><path d="M258 792 V804 H276"/><path d="M642 792 V804 H624"/></g>
  <text class="mono" x="266" y="128" font-size="14" font-weight="700" fill="#ffa053" letter-spacing="1.2">PC//WILDCARD-01</text>
  <text class="mono" x="634" y="128" font-size="14" font-weight="700" fill="#b4b4c0" text-anchor="end" letter-spacing="1.2">EN + JP · 0x5743</text>

  <!-- logo + title (glitch: offset red / cyan copies) -->
  <image href="poke-collect-logo.png" x="345" y="150" width="210" height="85.3" filter="url(#glow)"/>
  <g class="a-title"><g font-size="44" font-weight="900" text-anchor="middle" letter-spacing="1">
    <text x="447" y="292" fill="#ff2d55" opacity=".55">MYSTERY</text>
    <text x="453" y="292" fill="#ffd400" opacity=".7">MYSTERY</text>
    <text x="450" y="292" fill="#ffffff">MYSTERY</text>
    <text x="447" y="340" fill="#ff2d55" opacity=".55">PACK</text>
    <text x="453" y="340" fill="#ffd400" opacity=".7">PACK</text>
    <text x="450" y="340" fill="#ffffff">PACK</text>
  </g></g>
  <!-- glitch slices -->
  <rect x="300" y="276" width="70" height="4" fill="#07070b"/><rect x="505" y="322" width="56" height="3" fill="#07070b"/>
  <g transform="translate(450 368)">
    <rect x="-160" y="-17" width="320" height="32" rx="16" fill="#120a10" stroke="#ff7a1a" stroke-width="2.5" filter="url(#glow)"/>
    <text class="mono" y="5.5" text-anchor="middle" font-size="15" font-weight="700" fill="#fff" letter-spacing="1.6">WILDCARD EDITION · ANY CARD</text>
  </g>

  <!-- holographic wireframe card -->
  <g class="a-float"><g class="a-holo"><g transform="translate(450 500) rotate(-6)">
    <rect x="-78" y="-108" width="156" height="216" rx="12" fill="#0c0c12" opacity=".85"/>
    <rect x="-78" y="-108" width="156" height="216" rx="12" fill="none" stroke="url(#holo)" stroke-width="4" filter="url(#bigglow)"/>
    <rect x="-64" y="-94" width="128" height="188" rx="7" fill="none" stroke="url(#holo)" stroke-width="1.5" opacity=".7"/>
    <g stroke="url(#holo)" stroke-width="1" opacity=".35"><path d="M-64 -50 H64 M-64 0 H64 M-64 50 H64 M-32 -94 V94 M0 -94 V94 M32 -94 V94"/></g>
    <g filter="url(#glow)">
      <circle r="40" fill="none" stroke="#ff7a1a" stroke-width="7"/>
      <rect x="-40" y="-3.5" width="80" height="7" fill="#ff7a1a"/>
      <circle r="13" fill="#0c0c12" stroke="#ff7a1a" stroke-width="5"/>
    </g>
    <text y="-58" text-anchor="middle" font-size="40" font-weight="900" fill="#fff" filter="url(#glow)">?</text>
    <text class="mono" y="84" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffd2a6" letter-spacing=".6">REVEAL ON OPEN</text>
  </g></g></g>
  <!-- pixel sparks -->
  <g class="a-sparks" fill="#fff" filter="url(#glow)">
    <rect x="330" y="420" width="5" height="5"/><rect x="566" y="446" width="4" height="4"/><rect x="352" y="590" width="4" height="4"/>
    <rect x="552" y="604" width="5" height="5"/><rect x="590" y="400" width="3" height="3" fill="#ffc58a"/><rect x="304" y="508" width="3" height="3" fill="#ff7a1a"/></g>

  <!-- rising embers -->
  <g fill="#ffa053" filter="url(#glow)">
    <g class="a-ember"><rect x="318" y="640" width="4" height="4"/></g>
    <g class="a-ember" style="animation-delay:calc(var(--t)*-1s - 1s)"><rect x="584" y="660" width="4" height="4" fill="#ffd400"/></g>
    <g class="a-ember" style="animation-delay:calc(var(--t)*-1s - 2s)"><rect x="452" y="650" width="3" height="3"/></g>
    <g class="a-ember" style="animation-delay:calc(var(--t)*-1s - .5s)"><rect x="380" y="670" width="3" height="3" fill="#ff6a00"/></g>
    <g class="a-ember" style="animation-delay:calc(var(--t)*-1s - 1.5s)"><rect x="530" y="640" width="3" height="3" fill="#ff6a00"/></g>
    <g class="a-ember" style="animation-delay:calc(var(--t)*-1s - 2.5s)"><rect x="612" y="630" width="3" height="3"/></g>
  </g>

  <!-- tiers -->
  <rect x="252" y="650" width="396" height="128" rx="12" fill="#07070b" opacity=".72"/>
  <text class="mono" x="450" y="676" text-anchor="middle" font-size="14.5" font-weight="700" fill="#e6e6ee" letter-spacing="1.6">1 CARD · 5 TIERS · EVERY PACK</text>
  <g font-size="11.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0">
    <g class="a-ball a-ball0"><g transform="translate(294 712)">
      <g filter="url(#glow)">
      <circle r="20" fill="#0c0c12" stroke="#ff2d55" stroke-width="3"/><path d="M-20 0 A20 20 0 0 1 20 0 Z" fill="#ff2d55"/>
      
      <rect x="-20" y="-2.1" width="40" height="4.2" fill="#0c0c12"/><circle r="6.5" fill="#f4f4f6" stroke="#0c0c12" stroke-width="3"/>
      </g>
      <text y="42">POKE</text></g></g>
    <g class="a-ball a-ball1"><g transform="translate(372 712)">
      <g filter="url(#glow)">
      <circle r="20" fill="#0c0c12" stroke="#3d8bff" stroke-width="3"/><path d="M-20 0 A20 20 0 0 1 20 0 Z" fill="#3d8bff"/>
      <path d="M-17 -8 L-8 -17 L-8 -5 Z M17 -8 L8 -17 L8 -5 Z" fill="#ff2d55"/>
      <rect x="-20" y="-2.1" width="40" height="4.2" fill="#0c0c12"/><circle r="6.5" fill="#f4f4f6" stroke="#0c0c12" stroke-width="3"/>
      </g>
      <text y="42">GREAT</text></g></g>
    <g class="a-ball a-ball2"><g transform="translate(450 712)">
      <g filter="url(#glow)">
      <circle r="20" fill="#0c0c12" stroke="#ffd400" stroke-width="3"/><path d="M-20 0 A20 20 0 0 1 20 0 Z" fill="#1d1d24"/>
      <rect x="-14" y="-18" width="7" height="15" fill="#ffd400"/><rect x="7" y="-18" width="7" height="15" fill="#ffd400"/>
      <rect x="-20" y="-2.1" width="40" height="4.2" fill="#0c0c12"/><circle r="6.5" fill="#f4f4f6" stroke="#0c0c12" stroke-width="3"/>
      </g>
      <text y="42">ULTRA</text></g></g>
    <g class="a-ball a-ball3"><g transform="translate(528 712)">
      <g filter="url(#glow)">
      <circle r="20" fill="#0c0c12" stroke="#a46bff" stroke-width="3"/><path d="M-20 0 A20 20 0 0 1 20 0 Z" fill="#7b3fe4"/>
      <circle cx="-10" cy="-10" r="3.8" fill="#ff5fae"/><circle cx="10" cy="-10" r="3.8" fill="#ff5fae"/>
      <rect x="-20" y="-2.1" width="40" height="4.2" fill="#0c0c12"/><circle r="6.5" fill="#f4f4f6" stroke="#0c0c12" stroke-width="3"/>
      </g>
      <text y="42">MASTER</text></g></g>
    <g class="a-ball a-ball4"><g transform="translate(606 712)">
      <g filter="url(#glow)">
      <circle r="20" fill="#0c0c12" stroke="#ff8c2e" stroke-width="3"/><path d="M-20 0 A20 20 0 0 1 20 0 Z" fill="#f26b0f"/>
      <path d="M0 -19 L2.9 -12.6 L9.6 -12.2 L4.4 -8 L6.2 -1.6 L0 -5.2 L-6.2 -1.6 L-4.4 -8 L-9.6 -12.2 L-2.9 -12.6 Z" fill="#ffd400"/>
      <rect x="-20" y="-2.1" width="40" height="4.2" fill="#0c0c12"/><circle r="6.5" fill="#f4f4f6" stroke="#0c0c12" stroke-width="3"/>
      </g>
      <text y="42" fill="#ffb36b">LEGENDARY</text></g></g>
  </g>
  <text class="mono" x="450" y="800" text-anchor="middle" font-size="14" font-weight="700" fill="#c4c4ce" letter-spacing="1.2">OPEN ONLINE · SHIPPED TO YOU</text>

  <!-- moving scan beam -->
  <g class="a-beam"><rect x="235" y="-60" width="430" height="60" fill="url(#beam)"/></g>
  <!-- scanlines + sheen -->
  <rect x="235" y="38" width="430" height="824" fill="url(#scan)"/>
  <rect x="235" y="38" width="430" height="824" fill="url(#sheen)"/>
</g>
<rect class="a-edge" x="235" y="38" width="430" height="824" rx="14" fill="none" stroke="#ff7a1a" stroke-opacity=".55" stroke-width="2" filter="url(#glow)"/>
<rect class="a-edge2" x="235" y="38" width="430" height="824" rx="14" fill="none" stroke="#ff8c2e" stroke-width="5" filter="url(#bigglow)"/>
<circle cx="450" cy="60" r="10" fill="#07070b" stroke="#3a3a44" stroke-width="3"/>
</svg></body></html>
