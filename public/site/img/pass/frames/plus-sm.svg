<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Pack Pass Plus frame">
<style>.orbit{animation:spin 14s linear infinite;transform-origin:128px 120px}.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs><linearGradient id="pl-ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7DF3EA"/><stop offset="1" stop-color="#2EA8F0"/></linearGradient>
<filter id="pl-glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<g class="orbit"><circle cx="128" cy="120" r="104" fill="none" stroke="#7DF3EA" stroke-width="2" stroke-dasharray="3 9" opacity=".7"/></g>
<circle class="pulse" cx="128" cy="120" r="92" fill="none" stroke="#2EE6F0" stroke-width="10" opacity=".35" filter="url(#pl-glow)"/>
<circle cx="128" cy="120" r="91" fill="none" stroke="url(#pl-ring)" stroke-width="7"/>
<circle cx="128" cy="120" r="86.5" fill="none" stroke="#07202a" stroke-width="2.5"/>
<polygon points="128,19 134.3,28 128,37 121.7,28" fill="#7DF3EA" stroke="#07202a" stroke-width="1.6"/><polygon points="36,113 40.9,120 36,127 31.1,120" fill="#7DF3EA" stroke="#07202a" stroke-width="1.6"/><polygon points="220,113 224.9,120 220,127 215.1,120" fill="#7DF3EA" stroke="#07202a" stroke-width="1.6"/>

</svg>