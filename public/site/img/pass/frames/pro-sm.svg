<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Pack Pass Pro frame">
<style>.holo{animation:spin 6s linear infinite;transform-origin:128px 120px}.gem{animation:gem 2.4s ease-in-out infinite}.gem.g2{animation-delay:-.8s}.gem.g3{animation-delay:-1.6s}
.shine{animation:shine 3s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes gem{0%,100%{opacity:.75}50%{opacity:1;filter:brightness(1.4)}}
@keyframes shine{0%,55%{opacity:0}70%{opacity:1}85%,100%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs>
<linearGradient id="pr-a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7DF3EA"/><stop offset=".35" stop-color="#B98CFF"/><stop offset=".65" stop-color="#FF6FD8"/><stop offset="1" stop-color="#FFE07A"/></linearGradient>
<mask id="pr-ring"><circle cx="128" cy="120" r="96" fill="#fff"/><circle cx="128" cy="120" r="87" fill="#000"/></mask>
<filter id="pr-glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3.2"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<path d="M36,110 L12,86 L20,120 L8,146 L36,134 Z" fill="#2a1450" stroke="#B98CFF" stroke-width="3" stroke-linejoin="round"/>
<path d="M220,110 L244,86 L236,120 L248,146 L220,134 Z" fill="#2a1450" stroke="#FF6FD8" stroke-width="3" stroke-linejoin="round"/>
<circle cx="128" cy="120" r="92" fill="none" stroke="#B98CFF" stroke-width="12" opacity=".35" filter="url(#pr-glow)"/>
<g mask="url(#pr-ring)"><g class="holo"><rect x="28" y="20" width="200" height="200" fill="url(#pr-a)"/></g></g>
<circle cx="128" cy="120" r="96" fill="none" stroke="#1a0c33" stroke-width="2"/><circle cx="128" cy="120" r="87" fill="none" stroke="#1a0c33" stroke-width="2.5"/>
<g class="shine"><path d="M68,50 A91,91 0 0 1 148,30" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" opacity=".8"/></g>
<g class="gem"><polygon points="128,17 135.7,28 128,39 120.3,28" fill="#FF6FD8" stroke="#1a0c33" stroke-width="1.6"/></g>
<g class="gem g2"><polygon points="62,51 66.9,58 62,65 57.1,58" fill="#7DF3EA" stroke="#1a0c33" stroke-width="1.6"/></g><g class="gem g3"><polygon points="194,51 198.9,58 194,65 189.1,58" fill="#FFE07A" stroke="#1a0c33" stroke-width="1.6"/></g>
<g class="gem g3"><polygon points="56,168 60.2,174 56,180 51.8,174" fill="#B98CFF" stroke="#1a0c33" stroke-width="1.6"/></g><g class="gem g2"><polygon points="200,168 204.2,174 200,180 195.8,174" fill="#B98CFF" stroke="#1a0c33" stroke-width="1.6"/></g>
<defs><linearGradient id="pr-plate" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4B2A9A"/><stop offset="1" stop-color="#8a2a7a"/></linearGradient></defs>

</svg>