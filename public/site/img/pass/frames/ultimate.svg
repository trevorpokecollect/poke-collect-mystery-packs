<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Pack Pass Ultimate frame">
<style>.sweep{animation:sweep 2.8s ease-in-out infinite}.tw{animation:tw 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.tw.t2{animation-delay:-.8s}.tw.t3{animation-delay:-1.6s}
.aura{animation:aura 2.4s ease-in-out infinite}.crown{animation:crown 2.4s ease-in-out infinite;transform-origin:128px 30px}
@keyframes sweep{0%{transform:translateX(-200px)}60%,100%{transform:translateX(200px)}}
@keyframes tw{0%,100%{transform:scale(0) rotate(0);opacity:0}40%{transform:scale(1) rotate(45deg);opacity:1}70%{transform:scale(0) rotate(90deg);opacity:0}}
@keyframes aura{0%,100%{opacity:.45}50%{opacity:.9}}@keyframes crown{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
