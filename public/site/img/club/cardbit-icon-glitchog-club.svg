<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"><style>
@keyframes cb-bob-glitchog{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes cb-scan-glitchog{0%{transform:translateY(-80px)}100%{transform:translateY(300px)}}
@keyframes cb-rim-glitchog{0%,100%{stroke-opacity:.35}50%{stroke-opacity:1}}
.cb-bob-glitchog{animation:cb-bob-glitchog 2.6s ease-in-out infinite}
.cb-scan-glitchog{animation:cb-scan-glitchog 3.2s linear infinite}
.cb-rim-glitchog{animation:cb-rim-glitchog 1.8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.cb-bob-glitchog,.cb-scan-glitchog,.cb-rim-glitchog{animation:none}}
</style>
<defs><radialGradient id="bg-glitchog" cx="50%" cy="38%" r="70%"><stop offset="0" stop-color="#3c1f6b"/><stop offset="1" stop-color="#120f24"/></radialGradient>
<linearGradient id="face-glitchog" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b303b"/><stop offset="1" stop-color="#17191f"/></linearGradient>
<filter id="glow-glitchog" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="grid-glitchog" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#B26BFF" stroke-opacity=".10" stroke-width="1"/></pattern>
<clipPath id="c-glitchog"><circle cx="128" cy="128" r="128"/></clipPath></defs><g clip-path="url(#c-glitchog)"><rect width="256" height="256" fill="url(#bg-glitchog)"/><rect width="256" height="256" fill="url(#grid-glitchog)"/><g class="cb-bob-glitchog">
