<defs><linearGradient id="scan-glitchog" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="club-clip-glitchog"><circle cx="128" cy="128" r="128"/></clipPath></defs>
