<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"><style>
@keyframes cb-bob-latch{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes cb-scan-latch{0%{transform:translateY(-80px)}100%{transform:translateY(300px)}}
@keyframes cb-rim-latch{0%,100%{stroke-opacity:.35}50%{stroke-opacity:1}}
.cb-bob-latch{animation:cb-bob-latch 2.6s ease-in-out infinite}
.cb-scan-latch{animation:cb-scan-latch 3.2s linear infinite}
.cb-rim-latch{animation:cb-rim-latch 1.8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.cb-bob-latch,.cb-scan-latch,.cb-rim-latch{animation:none}}
</style><defs><clipPath id="c-latch"><circle cx="128" cy="128" r="128"/></clipPath></defs><g clip-path="url(#c-latch)"><rect width="256" height="256" fill="#17213B"/>
<g class="cb-bob-latch"><image href="data:image/webp;base64," x="0" y="0" width="256" height="256" preserveAspectRatio="xMidYMid meet"/></g></g>
<defs><linearGradient id="scan-latch" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="club-clip-latch"><circle cx="128" cy="128" r="128"/></clipPath></defs>
<g clip-path="url(#club-clip-latch)"><rect class="cb-scan-latch" x="0" y="0" width="256" height="60" fill="url(#scan-latch)"/></g>
<circle class="cb-rim-latch" cx="128" cy="128" r="124" fill="none" stroke="#4057F5" stroke-width="7"/></svg>
