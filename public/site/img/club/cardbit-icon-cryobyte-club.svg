<clipPath id="club-clip-cryobyte"><circle cx="128" cy="128" r="128"/></clipPath></defs>
<g clip-path="url(#club-clip-cryobyte)"><rect class="cb-scan-cryobyte" x="0" y="0" width="256" height="60" fill="url(#scan-cryobyte)"/></g>
<circle class="cb-rim-cryobyte" cx="128" cy="128" r="124" fill="none" stroke="#8CE8FF" stroke-width="7"/></svg>
