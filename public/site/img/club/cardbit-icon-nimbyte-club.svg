<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"><style>
@keyframes cb-bob-nimbyte{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes cb-scan-nimbyte{0%{transform:translateY(-80px)}100%{transform:translateY(300px)}}
@keyframes cb-rim-nimbyte{0%,100%{stroke-opacity:.35}50%{stroke-opacity:1}}
.cb-bob-nimbyte{animation:cb-bob-nimbyte 2.6s ease-in-out infinite}
.cb-scan-nimbyte{animation:cb-scan-nimbyte 3.2s linear infinite}
.cb-rim-nimbyte{animation:cb-rim-nimbyte 1.8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.cb-bob-nimbyte,.cb-scan-nimbyte,.cb-rim-nimbyte{animation:none}}
</style>
