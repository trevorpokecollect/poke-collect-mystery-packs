<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"><style>
@keyframes cb-bob-latchgold{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes cb-scan-latchgold{0%{transform:translateY(-80px)}100%{transform:translateY(300px)}}
@keyframes cb-rim-latchgold{0%,100%{stroke-opacity:.35}50%{stroke-opacity:1}}
.cb-bob-latchgold{animation:cb-bob-latchgold 2.6s ease-in-out infinite}
.cb-scan-latchgold{animation:cb-scan-latchgold 3.2s linear infinite}
.cb-rim-latchgold{animation:cb-rim-latchgold 1.8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.cb-bob-latchgold,.cb-scan-latchgold,.cb-rim-latchgold{animation:none}}
</style><defs><clipPath id="c-latch-gold"><circle cx="128" cy="128" r="128"/></clipPath></defs><g clip-path="url(#c-latch-gold)"><rect width="256" height="256" fill="#17213B"/>
<g class="cb-bob-latchgold"><image href="data:image/webp;base64," x="0" y="0" width="256" height="256" preserveAspectRatio="xMidYMid meet"/></g></g>
<defs><linearGradient id="scan-latchgold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="club-clip-latchgold"><circle cx="128" cy="128" r="128"/></clipPath></defs>
<g clip-path="url(#club-clip-latchgold)"><rect class="cb-scan-latchgold" x="0" y="0" width="256" height="60" fill="url(#scan-latchgold)"/></g>
<circle class="cb-rim-latchgold" cx="128" cy="128" r="124" fill="none" stroke="#FFC94D" stroke-width="7"/></svg>
