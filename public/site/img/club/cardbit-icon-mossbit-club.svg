g>
<defs><linearGradient id="scan-mossbit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="club-clip-mossbit"><circle cx="128" cy="128" r="128"/></clipPath></defs>
<g clip-path="url(#club-clip-mossbit)"><rect class="cb-scan-mossbit" x="0" y="0" width="256" height="60" fill="url(#scan-mossbit)"/></g>
