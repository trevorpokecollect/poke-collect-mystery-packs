<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"><style>
@keyframes cb-bob-mossbit{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes cb-scan-mossbit{0%{transform:translateY(-80px)}100%{transform:translateY(300px)}}
@keyframes cb-rim-mossbit{0%,100%{stroke-opacity:.35}50%{stroke-opacity:1}}
.cb-bob-mossbit{animation:cb-bob-mossbit 2.6s ease-in-out infinite}
.cb-scan-mossbit{animation:cb-scan-mossbit 3.2s linear infinite}
.cb-rim-mossbit{animation:cb-rim-mossbit 1.8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.cb-bob-mossbit,.cb-scan-mossbit,.cb-rim-mossbit{animation:none}}
</style>
<defs><radialGradient id="bg-mossbit" cx="50%" cy="38%" r="70%"><stop offset="0" stop-color="#1d5a33"/><stop offset="1" stop-color="#0f1a17"/></radialGradient>
<linearGradient id="face-mossbit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b303b"/><stop offset="1" stop-color="#17191f"/></linearGradient>
<filter id="glow-mossbit" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="grid-mossbit" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#4BE07A" stroke-opacity=".10" stroke-width="1"/></pattern>
<clipPath id="c-mossbit"><circle cx="128" cy="128" r="128"/></clipPath></defs><g clip-path="url(#c-mossbit)"><rect width="256" height="256" fill="url(#bg-mossbit)"/><rect width="256" height="256" fill="url(#grid-mossbit)"/><g class="cb-bob-mossbit">
<ellipse cx="128" cy="226" rx="60" ry="9" fill="#000" opacity=".3"/>
