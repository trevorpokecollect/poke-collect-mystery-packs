<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"><style>
@keyframes cb-bob-driplink{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes cb-scan-driplink{0%{transform:translateY(-80px)}100%{transform:translateY(300px)}}
@keyframes cb-rim-driplink{0%,100%{stroke-opacity:.35}50%{stroke-opacity:1}}
.cb-bob-driplink{animation:cb-bob-driplink 2.6s ease-in-out infinite}
.cb-scan-driplink{animation:cb-scan-driplink 3.2s linear infinite}
.cb-rim-driplink{animation:cb-rim-driplink 1.8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.cb-bob-driplink,.cb-scan-driplink,.cb-rim-driplink{animation:none}}
</style>
<defs><radialGradient id="bg-driplink" cx="50%" cy="38%" r="70%"><stop offset="0" stop-color="#163f74"/><stop offset="1" stop-color="#0f1526"/></radialGradient>
<linearGradient id="face-driplink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b303b"/><stop offset="1" stop-color="#17191f"/></linearGradient>
<filter id="glow-driplink" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="grid-driplink" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#3FA9FF" stroke-opacity=".10" stroke-width="1"/></pattern>
<clipPath id="c-driplink"><circle cx="128" cy="128" r="128"/></clipPath></defs><g clip-path="url(#c-driplink)"><rect width="256" height="256" fill="url(#bg-driplink)"/><rect width="256" height="256" fill="url(#grid-driplink)"/><g class="cb-bob-driplink">
<ellipse cx="128" cy="226" rx="60" ry="9" fill="#000" opacity=".3"/>
<rect x="104" y="200" width="16" height="14" fill="#2a2e36"/><rect x="97" y="212" width="30" height="10" rx="3" fill="#e7eaef"/><rect x="97" y="220" width="30" height="5" rx="2" fill="#3FA9FF"/><rect x="144" y="200" width="16" height="14" fill="#2a2e36"/><rect x="137" y="212" width="30" height="10" rx="3" fill="#e7eaef"/><rect x="137" y="220" width="30" height="5" rx="2" fill="#3FA9FF"/><g transform="translate(74,172) scale(1,1)"><rect x="-9" y="-14" width="18" height="16" rx="4" fill="#e7eaef"/><rect x="-9" y="-4" width="18" height="5" fill="#3FA9FF"/><path d="M-10,4 a10,10 0 1,0 20,0" stroke="#e7eaef" stroke-width="7" fill="none" stroke-linecap="round"/></g><g transform="translate(190,172) scale(-1,1)"><rect x="-9" y="-14" width="18" height="16" rx="4" fill="#e7eaef"/><rect x="-9" y="-4" width="18" height="5" fill="#3FA9FF"/><path d="M-10,4 a10,10 0 1,0 20,0" stroke="#e7eaef" stroke-width="7" fill="none" stroke-linecap="round"/></g><path d="M132,60 C150,90 184,118 184,156 A52,52 0 0 1 80,156 C80,118 114,90 132,60 Z" fill="url(#face-driplink)" stroke="#3FA9FF" stroke-width="7" filter="url(#glow-driplink)"/><g stroke="#3FA9FF" stroke-width="4" fill="none" stroke-linecap="round" filter="url(#glow-driplink)"><path d="M160,58 a14,14 0 0 1 14,14"/><path d="M160,46 a26,26 0 0 1 26,26"/></g><circle cx="160" cy="72" r="4" fill="#3FA9FF"/><path d="M100,186 q8,-6 16,0 t16,0 t16,0" stroke="#3FA9FF" stroke-width="3" fill="none" opacity=".7"/><rect x="104.0" y="141" width="16" height="18" rx="3" fill="#fff"/><rect x="144.0" y="141" width="16" height="18" rx="3" fill="#fff"/><path d="M126.0,172 Q132,179 138.0,169" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/></g></g>
<defs><linearGradient id="scan-driplink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="club-clip-driplink"><circle cx="128" cy="128" r="128"/></clipPath></defs>
<g clip-path="url(#club-clip-driplink)"><rect class="cb-scan-driplink" x="0" y="0" width="256" height="60" fill="url(#scan-driplink)"/></g>
<circle class="cb-rim-driplink" cx="128" cy="128" r="124" fill="none" stroke="#3DB8FF" stroke-width="7"/></svg>
