<filter id="glow-wyrmware" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="grid-wyrmware" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#FF4D6D" stroke-opacity=".10" stroke-width="1"/></pattern>
<clipPath id="c-wyrmware"><circle cx="128" cy="128" r="128"/></clipPath></defs><g clip-path="url(#c-wyrmware)"><rect width="256" height="256" fill="url(#bg-wyrmware)"/><rect width="256" height="256" fill="url(#grid-wyrmware)"/><g class="cb-bob-wyrmware">
