<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"><style>
@keyframes cb-bob-wyrmware{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes cb-scan-wyrmware{0%{transform:translateY(-80px)}100%{transform:translateY(300px)}}
@keyframes cb-rim-wyrmware{0%,100%{stroke-opacity:.35}50%{stroke-opacity:1}}
.cb-bob-wyrmware{animation:cb-bob-wyrmware 2.6s ease-in-out infinite}
.cb-scan-wyrmware{animation:cb-scan-wyrmware 3.2s linear infinite}
.cb-rim-wyrmware{animation:cb-rim-wyrmware 1.8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.cb-bob-wyrmware,.cb-scan-wyrmware,.cb-rim-wyrmware{animation:none}}
</style>
<defs><radialGradient id="bg-wyrmware" cx="50%" cy="38%" r="70%"><stop offset="0" stop-color="#5a1424"/><stop offset="1" stop-color="#140d1a"/></radialGradient>
