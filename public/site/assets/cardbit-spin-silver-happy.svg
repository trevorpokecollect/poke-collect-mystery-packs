<rect x="157" y="151" width="9" height="4" rx="2"/><rect x="151" y="151" width="5" height="4" rx="2" opacity=".6"/></g></g></g>
<g transform="translate(52,-14)"><g class="rain" style="--h:-260px;--sway:-8px;animation-delay:-0.00s"><g transform="scale(0.9)"><g stroke="#CFF6FF" stroke-width="2.6" stroke-linecap="round"><path d="M0,-10 V10 M-8.7,-5 L8.7,5 M-8.7,5 L8.7,-5"/><path d="M-3,-7 L0,-4 L3,-7 M-3,7 L0,4 L3,7" stroke-width="1.8"/></g></g></g></g>
